name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  client:
    name: Client TypeScript + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Run client unit tests
        run: |
          set -e
          for f in tests/*.test.ts; do
            echo "--- $f ---"
            npx tsx "$f"
          done

  firestore-rules:
    name: Firestore rules (real emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Run Firestore security rules tests against the real emulator
        run: npm run test:rules

  functions:
    name: Functions build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        working-directory: functions
        run: npm ci
      - name: Build and run functions tests
        working-directory: functions
        run: npm test
